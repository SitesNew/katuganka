
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset="UTF-8"">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Адаптивное меню</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
        }
        /* Основное меню */
        .menu {
            background: #333; /* Цвет фона главного меню */
            display: flex;
            flex-wrap: nowrap; /* Запрещаем перенос пунктов меню */
            justify-content: flex-start; /* Выравниваем пункты меню в строку */
            padding: 10px;
        }
        .menu a {
            color: white; /* Цвет текста пунктов главного меню */
            text-decoration: none;
            padding: 10px 15px;
            display: block;
        }
        .menu a:hover {
            background: #555; /* Цвет фона при наведении на пункты меню */
        }
        .dropdown {
            position: relative;
        }
        /* Подменю */
        .dropdown-content {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background: #666; /* Цвет фона подменю */
            min-width: 150px;
        }
        .dropdown-content a {
            padding: 10px;
            display: block;
            background: #777; /* Цвет фона пунктов подменю */
            color: #fff; /* Цвет текста пунктов подменю */
        }
        .dropdown-content a:hover {
            background: #999; /* Цвет фона при наведении на пункты подменю */
        }
        .dropdown:hover .dropdown-content {
            display: block;
        }
        .menu-toggle {
            display: none;
            background: #333;
            color: white;
            padding: 10px;
            cursor: pointer;
        }
        @media (max-width: 768px) {
            .menu {
                display: none;
                flex-direction: column;
            }
            .menu-toggle {
                display: block;
            }
            .menu.active {
                display: flex;
            }
            .dropdown-content {
                position: static;
                display: none;
            }
            .dropdown.active .dropdown-content {
                display: block;
            }
        }
    </style>
</head>
<body>
    <div class="menu-toggle">Меню</div>
    <nav class="menu">
        <a href="#">Главная</a>
        <div class="dropdown">
            <a href="#">Раздел 1</a>
            <div class="dropdown-content">
                <a href="#">Подраздел 1-1</a>
                <a href="#">Подраздел 1-2</a>
                <a href="#">Подраздел 1-3</a>
            </div>
        </div>
        <div class="dropdown">
            <a href="#">Раздел 2</a>
            <div class="dropdown-content">
                <a href="#">Подраздел 2-1</a>
                <a href="#">Подраздел 2-2</a>
                <a href="#">Подраздел 2-3</a>
            </div>
        </div>
        <div class="dropdown">
            <a href="#">Раздел 3</a>
            <div class="dropdown-content">
                <a href="#">Подраздел 3-1</a>
                <a href="#">Подраздел 3-2</a>
                <a href="#">Подраздел 3-3</a>
            </div>
        </div>
        <a href="#">Контакты</a>
    </nav>
    <script>  
        document.querySelector('.menu-toggle').addEventListener('click', function() {
            document.querySelector('.menu').classList.toggle('active');
        });
        document.querySelectorAll('.dropdown > a').forEach(function(el) {
            el.addEventListener('click', function(e) {
                if (window.innerWidth <= 768) {
                    e.preventDefault();
                    this.parentElement.classList.toggle('active');
                }
            });
        });
    </script>
</body>
</html>
